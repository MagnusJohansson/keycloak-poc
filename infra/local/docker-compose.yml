# ---------------------------------------------------------------------------
# The local Keycloak lab.
#
# Upstream Keycloak, configured to behave like the Azure deployment in
# infra/terraform/10-keycloak-azure: same version, same feature flags, real
# Postgres rather than the dev-mode in-memory database. That is the point -
# infra/terraform/20-realm applies to this container and to Azure with no change
# beyond a URL, so the free lab is a faithful rehearsal rather than a toy.
# ---------------------------------------------------------------------------
name: docvault

# Image refs are overridable because Docker Hub rate-limits anonymous pulls
# (HTTP 429) and that is the single most common reason `make up` fails on a fresh
# machine. The defaults therefore avoid Docker Hub: Keycloak comes from quay.io
# and OpenFGA from ghcr.io (their home registries), and the two Docker Hub
# images come via Google's public pull-through mirror. Override with your own
# registry if you prefer:
#
#   POSTGRES_IMAGE=docker.io/library/postgres:17-alpine make up
services:
  postgres:
    image: ${POSTGRES_IMAGE:-mirror.gcr.io/library/postgres:17-alpine}
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    # Pinned to the same version as infra/terraform/10-keycloak-azure, so local
    # and cloud behave identically. Keep the two in step.
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.6.3}
    command: ["start-dev"]
    depends_on:
      postgres:
        condition: service_healthy
      # Not for the directory's sake: Keycloak reads its truststore once, at
      # start, and the directory writes its certificate there on first start.
      ldap:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      # Exposes /health/ready and /metrics on the management port (9000).
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      # Keep in step with the Azure deployment so behaviour is identical.
      #   organization  - multi-tenancy primitives
      #   opentelemetry - tracing
      #   resource-indicators - EXPERIMENTAL in 26.6. RFC 8707: makes Keycloak honour
      #     the `resource` parameter MCP clients send, so a token for the MCP server
      #     carries that server's URL as `aud`. Not enabled on Azure. See 20-realm/mcp.tf.
      KC_FEATURES: "organization,opentelemetry,resource-indicators"

      KC_LOG_LEVEL: info
    ports:
      - "8080:8080"   # public / auth endpoints
      - "9000:9000"   # management: health + metrics (keep internal in production)
    volumes:
      # Mounted read-only for reference, but NOT auto-imported: the command above
      # deliberately omits --import-realm.
      #
      # Auto-importing fights Terraform. Keycloak would create the realm on boot,
      # and `make seed` would then fail with
      #   409 Conflict {"errorMessage":"Realm docvault already exists"}
      # because Terraform has no state for a realm it did not create. Terraform is
      # the source of truth, so it must be the thing that creates the realm.
      #
      # To import this export by hand instead, use the admin console or
      # `kc.sh import`, and skip `make seed`.
      - ./realm-export:/opt/keycloak/data/import:ro
      # The directory's certificate. Keycloak trusts every PEM file in this
      # folder, which is how it accepts ldaps://ldap:636 and nothing posing as it.
      - ldapcert:/opt/keycloak/conf/truststores:ro
    healthcheck:
      # The Keycloak image ships no curl or wget, so probe with bash's /dev/tcp.
      # Note the CRLF: HTTP requires \r\n line endings, and bare \n gets a 400
      # Bad Request - which surfaces as a permanently "unhealthy" container
      # sitting next to a Keycloak that is actually serving fine.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # The lab's directory: OpenLDAP with a few people and groups, which Keycloak
  # reads through LDAP user federation (20-realm/ldap.tf, docs/use-cases/uc7).
  # Built from ./ldap. No port is published: only Keycloak, on this network,
  # talks to it, and only over TLS. To look inside or change it, use the socket in the container:
  #   make ldap-search
  ldap:
    build: ./ldap
    image: docvault-ldap:local
    networks:
      default:
        # A second name for the same server, which its certificate does not
        # carry. `make assert-ldap` uses it to prove Keycloak checks the name.
        aliases: [ldap-under-another-name]
    volumes:
      - ldapkey:/tls/private    # the private key: this container only
      - ldapcert:/tls/public    # the certificate: Keycloak reads it, below
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -Q -Y EXTERNAL -H ldapi://%2Frun%2Fopenldap%2Fldapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- OpenFGA: who may see THIS document (docs/use-cases/uc1) ---------------
  # Its own database, not a second one inside `postgres` above: Postgres runs
  # init scripts only on an empty data directory, so a database added there
  # would never be created on an existing lab's `pgdata` volume.
  openfga-db:
    image: ${POSTGRES_IMAGE:-mirror.gcr.io/library/postgres:17-alpine}
    environment:
      POSTGRES_DB: openfga
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: openfga
    volumes:
      - fgadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates or upgrades OpenFGA's tables, then exits. Safe to run on every start.
  openfga-migrate:
    image: &openfga ${OPENFGA_IMAGE:-ghcr.io/openfga/openfga:v1.22.1}
    command: ["migrate"]
    depends_on:
      openfga-db:
        condition: service_healthy
    environment: &openfga-datastore
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
    restart: "no"

  openfga:
    # From ghcr.io, OpenFGA's own registry: no Docker Hub rate limit.
    image: *openfga
    command: ["run"]
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    environment:
      <<: *openfga-datastore
      # Every caller presents this key. The lab's, like admin/admin above;
      # 25-openfga and `make api` read the same default.
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_API_KEY:-docvault-fga-lab-key}

      # Both already the defaults in v1.22.1, stated so that changing them is a
      # visible decision:
      #   - the check cache: on, a REVOKED share stays allowed until the cache
      #     entry expires (10 s by default), and a NEW share stays refused just
      #     as long (both measured). The API asks for HIGHER_CONSISTENCY, which
      #     skips the cache; tools/assert-fga.py passes with it on, and fails
      #     with it on and HIGHER_CONSISTENCY taken out.
      #   - the playground: a UI that edits stores, with no place in a lab that
      #     is meant to rehearse production.
      OPENFGA_CHECK_QUERY_CACHE_ENABLED: "false"
      OPENFGA_PLAYGROUND_ENABLED: "false"
    ports:
      # 8090, not OpenFGA's 8080: that is Keycloak's on this host. The gRPC
      # port (8081) is not published; the API uses HTTP.
      - "8090:8080"
    healthcheck:
      # The image has no shell, curl or wget; it ships this probe for the gRPC port.
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Catches password-reset / verification mail so the email flows in
  # docs/use-cases are actually demonstrable. UI at http://localhost:8025
  mailpit:
    image: ${MAILPIT_IMAGE:-mirror.gcr.io/axllent/mailpit:latest}
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

volumes:
  pgdata:
  ldapkey:
  ldapcert:
  fgadata:
