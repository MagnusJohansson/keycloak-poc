include /etc/openldap/schema/core.schema
include /etc/openldap/schema/cosine.schema
include /etc/openldap/schema/inetorgperson.schema

modulepath /usr/lib/openldap
moduleload back_mdb.so
moduleload argon2.so

pidfile  /run/openldap/slapd.pid
argsfile /run/openldap/slapd.args

password-hash {ARGON2}

# Made on first start by entrypoint.sh. slapd listens on ldaps:// only.
TLSCertificateFile    /tls/public/ldap.crt
TLSCertificateKeyFile /tls/private/ldap.key
TLSProtocolMin        3.3

# Nobody reads this directory without saying who they are.
disallow bind_anon
require  authc

# No administrator password. Root inside the container, over the local socket,
# is the administrator: `docker compose exec ldap ldapmodify -Y EXTERNAL -H ldapi://...`.
# Nothing on the network can be.
authz-regexp "gidNumber=0[+]uidNumber=0,cn=peercred,cn=external,cn=auth" "cn=admin,dc=docvault,dc=test"

database  mdb
maxsize   67108864
suffix    "dc=docvault,dc=test"
rootdn    "cn=admin,dc=docvault,dc=test"
directory /var/lib/openldap/openldap-data

index objectClass eq
index uid,cn,mail eq
index member eq
index entryUUID eq

# A password can be checked (a bind) and never read: not by Keycloak's account,
# not by its owner.
access to attrs=userPassword
  by anonymous auth
  by * none

# Keycloak's account reads people and groups. It writes nothing, and nobody
# else reads anything.
access to dn.subtree="dc=docvault,dc=test"
  by dn.exact="cn=keycloak,ou=services,dc=docvault,dc=test" read
  by * none
