# Runs entirely against Docker Keycloak: no cloud account, no secrets.
# That is deliberate - a lab whose CI needs a paid subscription is a lab nobody
# can contribute to.
name: CI

on:
  push: { branches: [main] }
  pull_request:

# Read-only: no job here writes to the repository or needs a token for more.
# Actions are pinned to commit SHAs (version in the comment); Dependabot updates them.
permissions:
  contents: read

jobs:
  license:
    name: Licence headers
    runs-on: ubuntu-latest
    # No toolchain, no secrets - it is a grep. Runs first so an unmarked new
    # source file fails in seconds rather than after the whole matrix.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: tools/license-header.sh --check

  api:
    name: .NET API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore apps/api-dotnet/DocVault.slnx
      - run: dotnet build apps/api-dotnet/DocVault.slnx --no-restore --configuration Release
      - name: Test (unit + integration + security)
        run: dotnet test apps/api-dotnet/DocVault.slnx --no-build --configuration Release --verbosity normal

      # The desktop OIDC logic lives in a plain net10.0 library precisely so it can be tested
      # here, on Linux, without a Windows runner. Only the XAML shell needs Windows.
      - name: Test desktop auth library
        run: dotnet test apps/desktop-winui/DocVault.Desktop.Auth.Tests --configuration Release --verbosity normal

  web:
    name: Web clients
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web-react, web-vue]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci || npm install
        working-directory: apps/${{ matrix.app }}
      - name: Build
        working-directory: apps/${{ matrix.app }}
        env:
          # Build-time only; the real value is injected at deploy time.
          VITE_OIDC_AUTHORITY: http://localhost:8080/realms/docvault
          VITE_OIDC_CLIENT_ID: docvault-${{ matrix.app }}
        run: npm run build

  flutter:
    name: Flutter client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
        working-directory: apps/mobile-flutter
      - run: flutter analyze
        working-directory: apps/mobile-flutter
      # The config test asserts the --dart-define-from-file wiring works, so the
      # defines have to be supplied here too.
      - run: flutter test --dart-define-from-file=config/local.json
        working-directory: apps/mobile-flutter

  winui:
    name: WinUI 3 desktop client
    # The only job that needs Windows. WinUI XAML compilation cannot run on Linux or macOS, so
    # without this the shell would ship having never been compiled anywhere.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build apps/desktop-winui/DocVault.Desktop.slnx --configuration Release
      - name: Test
        run: dotnet test apps/desktop-winui/DocVault.Desktop.Auth.Tests --configuration Release --verbosity normal

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [10-keycloak-azure, 20-realm, 30-azure]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - run: terraform fmt -check -diff
        working-directory: infra/terraform/${{ matrix.module }}
      # -backend=false: validation needs no state and no credentials.
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform/${{ matrix.module }}
      - run: terraform validate
        working-directory: infra/terraform/${{ matrix.module }}

  realm-applies:
    name: Realm applies to real Keycloak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      # The claim this repo rests on: the realm module works against upstream
      # Keycloak. If that ever stops being true, this job fails.
      - name: Start Keycloak
        run: |
          docker compose -f infra/local/docker-compose.yml up -d
          for i in $(seq 1 60); do
            curl -sfo /dev/null http://localhost:8080/realms/master && exit 0
            sleep 2
          done
          docker compose -f infra/local/docker-compose.yml logs keycloak
          exit 1

      - name: Apply the realm
        working-directory: infra/terraform/20-realm
        run: |
          terraform init -backend=false -input=false
          terraform apply -auto-approve -input=false \
            -var-file="$GITHUB_WORKSPACE/infra/environments/local/realm.tfvars"

      - name: Assert the silent-failure configuration actually took effect
        run: |
          set -euo pipefail
          # Both of these produce NO error when missing, so assert them explicitly.
          acr=$(curl -sf http://localhost:8080/realms/docvault/.well-known/openid-configuration \
                 | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin)["acr_values_supported"]))')
          echo "acr_values_supported = $acr"
          echo "$acr" | grep -q silver || { echo "acr.loa.map did not take effect"; exit 1; }

          secret=$(terraform -chdir=infra/terraform/20-realm output -raw worker_client_secret)
          aud=$(curl -sf -X POST http://localhost:8080/realms/docvault/protocol/openid-connect/token \
                  -d client_id=docvault-worker -d "client_secret=$secret" -d grant_type=client_credentials \
                | python3 -c 'import base64,json,sys; t=json.load(sys.stdin)["access_token"].split(".")[1]; t+="="*(-len(t)%4); print(json.loads(base64.urlsafe_b64decode(t))["aud"])')
          echo "aud = $aud"
          echo "$aud" | grep -q docvault-api || { echo "audience mapper did not take effect"; exit 1; }

      # Keycloak orders a flow's executions by `priority` alone; ties are in database
      # order, which differs between fresh Keycloaks. With the OTP subflow first, a
      # correct password is answered "Invalid username or password".
      - name: Step-up flow runs in the intended order
        run: |
          set -euo pipefail
          token=$(curl -sf -X POST http://localhost:8080/realms/master/protocol/openid-connect/token \
                    -d client_id=admin-cli -d username=admin -d password=admin -d grant_type=password \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -sf -H "Authorization: Bearer $token" \
            http://localhost:8080/admin/realms/docvault/authentication/flows/browser-stepup/executions \
          | python3 -c '
          import json, sys
          got = [(e["level"], e["displayName"]) for e in json.load(sys.stdin)]
          want = [(0, "Cookie"), (0, "stepup-forms"),
                  (1, "stepup-loa1-password"), (2, "Condition - Level of Authentication"), (2, "Username Password Form"),
                  (1, "stepup-loa2-otp"), (2, "Condition - Level of Authentication"), (2, "OTP Form")]
          print("\n".join(f"{l} {n}" for l, n in got))
          sys.exit(0 if got == want else "browser-stepup executions are not in the intended order")
          '

      # The API never calls Authorization Services, so nothing else would notice a
      # wrong model. It was wrong once: permissions without `type = "scope"`
      # refused an editor even `view`, silently, since the first commit.
      - name: Authorization model grants what it claims to
        run: ./tools/assert-authz-model.sh

      # MCP authorization depends on realm settings that fail silently: with the
      # resource-indicators feature off, or a mapper missing, sign-in still works
      # and only the audience is wrong. So run the real servers against this
      # Keycloak and sign in as the demo users.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Start the API and the MCP server
        run: |
          set -euo pipefail
          dotnet build apps/api-dotnet/DocVault.slnx --configuration Release
          secret=$(terraform -chdir=infra/terraform/20-realm output -raw mcp_server_client_secret)
          echo "::add-mask::$secret"
          echo "MCP_CLIENT_SECRET=$secret" >> "$GITHUB_ENV"
          # The script reads what the servers wrote about its own calls.
          echo "MCP_AUDIT_LOG=$PWD/mcp-audit.jsonl" >> "$GITHUB_ENV"
          echo "DOCVAULT_API_LOG=$PWD/api.log" >> "$GITHUB_ENV"
          ASPNETCORE_URLS=http://localhost:5001 nohup dotnet run --no-build --configuration Release \
            --project apps/api-dotnet/DocVault.Api --no-launch-profile > api.log 2>&1 &
          ASPNETCORE_URLS=http://localhost:5002 Mcp__ClientSecret="$secret" Audit__File="$PWD/mcp-audit.jsonl" nohup dotnet run --no-build --configuration Release \
            --project apps/mcp-dotnet/DocVault.Mcp --no-launch-profile > mcp.log 2>&1 &
          for i in $(seq 1 30); do
            a=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/documents || true)
            m=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5002/mcp || true)
            [ "$a$m" = "401401" ] && exit 0
            sleep 2
          done
          cat api.log mcp.log
          exit 1

      - name: MCP authorization works end to end
        run: python3 tools/assert-mcp-authz.py

      # LDAP federation: people who exist only in the directory sign in, and then
      # the directory changes under Keycloak. With Keycloak's default cache a
      # person removed from a group, or deleted, goes on getting tokens; nothing
      # but a check that changes the directory would notice.
      - name: LDAP federation works end to end
        run: python3 tools/assert-ldap.py

      - name: Server logs (on failure)
        if: failure()
        run: |
          cat api.log mcp.log mcp-audit.jsonl || true
          # Keycloak's events say WHY a sign-in was refused; its pages do not.
          docker compose -f infra/local/docker-compose.yml logs keycloak | grep -E "org.keycloak.events|ERROR|WARN|requires user" | tail -60 || true
          docker compose -f infra/local/docker-compose.yml logs ldap | tail -40 || true

      - name: Plan is empty (no drift)
        working-directory: infra/terraform/20-realm
        run: |
          terraform plan -detailed-exitcode -input=false \
            -var-file="$GITHUB_WORKSPACE/infra/environments/local/realm.tfvars" \
            || { code=$?; [ "$code" = "2" ] && echo "Realm drifted on re-plan" && exit 1; exit $code; }
