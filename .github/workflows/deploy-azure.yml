# Deploys the API to Azure Container Apps.
#
# NO STORED AZURE CREDENTIALS. Authentication uses GitHub OIDC federation: GitHub
# attests to the workflow's identity and Entra ID trusts that attestation, so
# there is no service-principal secret to leak, rotate, or accidentally print.
# It is the same idea as the worker's client_credentials grant - replace a
# standing secret with a short-lived, attested token.
#
# MANUAL ONLY, AND NOT SET UP IN THIS REPOSITORY. It needs the Azure deployment
# to be up (infra/terraform/30-azure creates the registry and the container
# app), an app registration with a federated credential for this repository
# (nothing here creates one), and the repository variables AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and ACR_NAME. None of that is in place,
# so it does not run on a release tag, where it could only fail. It has not
# been run successfully.
name: Deploy to Azure

on:
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

env:
  RESOURCE_GROUP: rg-docvault-lab
  CONTAINER_APP: ca-docvault-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          # Configure these as federated credentials on the app registration.
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/docvault-api:${GITHUB_SHA::7}"
          docker build -t "$IMAGE" apps/api-dotnet
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

      - name: Smoke test
        run: |
          fqdn=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
                   --query 'properties.configuration.ingress.fqdn' -o tsv)

          # /health is anonymous by design, so a probe needs no token.
          curl -sf "https://$fqdn/health" || { echo "health check failed"; exit 1; }

          # And the deny-by-default posture still holds after deployment.
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$fqdn/documents")
          [ "$code" = "401" ] || { echo "Expected 401 without a token, got $code"; exit 1; }
