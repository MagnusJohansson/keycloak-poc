# Deploys the API to Azure Container Apps.
#
# NO STORED AZURE CREDENTIALS. Authentication uses GitHub OIDC federation: GitHub
# attests to the workflow's identity and Entra ID trusts that attestation, so
# there is no service-principal secret to leak, rotate, or accidentally print.
# It is the same idea as the worker's client_credentials grant - replace a
# standing secret with a short-lived, attested token.
name: Deploy to Azure

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

env:
  RESOURCE_GROUP: rg-docvault-lab
  CONTAINER_APP: ca-docvault-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          # Configure these as federated credentials on the app registration.
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/docvault-api:${GITHUB_SHA::7}"
          docker build -t "$IMAGE" apps/api-dotnet
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

      - name: Smoke test
        run: |
          fqdn=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
                   --query 'properties.configuration.ingress.fqdn' -o tsv)

          # /health is anonymous by design, so a probe needs no token.
          curl -sf "https://$fqdn/health" || { echo "health check failed"; exit 1; }

          # And the deny-by-default posture still holds after deployment.
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$fqdn/documents")
          [ "$code" = "401" ] || { echo "Expected 401 without a token, got $code"; exit 1; }
